project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "blog/**/*.qmd"
  resources:
    - robots.txt
    - .nojekyll

website:
  title: "Daniel Yorke Consulting"
  # The public address of the site. If you move to a custom domain,
  # change this line AND `site-url` in _variables.yml.
  site-url: "https://d-2034.github.io/Consulting/"
  description: "Analytics, data, and 1:1 AI consulting for small businesses and busy professionals. Vancouver, BC."
  favicon: assets/img/favicon.svg
  image: assets/img/og-image.png
  open-graph: true
  twitter-card: true
  page-navigation: false
  back-to-top-navigation: false
  search: false
  navbar:
    title: "Daniel Yorke"
    collapse-below: md
    left:
      - text: Home
        href: index.qmd
      - text: Services
        href: services.qmd
      - text: Examples
        href: examples.qmd
      - text: About
        href: about.qmd
      - text: Contact
        href: contact.qmd
      # To launch the blog, un-comment the next two lines:
      # - text: Notes
      #   href: blog/index.qmd
    right:
      - text: Get in touch
        href: contact.qmd
  page-footer:
    left: "© 2026 Daniel Yorke Consulting"
    right: "[{{< var email >}}](mailto:{{< var email >}})"

format:
  html:
    theme:
      light: [cosmo, assets/css/custom.scss]
      dark: [cosmo, assets/css/custom.scss, assets/css/dark.scss]
    respect-user-color-scheme: true
    toc: false
    anchor-sections: false
    smooth-scroll: false
    link-external-newwindow: false
    header-includes: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
    # Privacy-friendly analytics: none in v1. To add GoatCounter later,
    # un-comment and replace YOURCODE (one line to remove again):
    # include-after-body: { text: '<script data-goatcounter="https://YOURCODE.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>' }
